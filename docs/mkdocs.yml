# 260704Cl: MkDocs Material configuration for the PressureCalculator GitHub Pages manual.
#   Ported from CSManager/docs/mkdocs.yml (explicit per-language nav, 11 languages, so that
#   `mkdocs build --strict` catches any missing/extra page). search.lang lists stemmers bundled
#   by mkdocs-material (one `zh` serves zh-Hans and zh-Hant; `ko` for Korean); extra.alternate
#   carries every language for the header selector and is retargeted to the matching slug by
#   language_switch.js.
site_name: PressureCalculator Manual
site_description: PressureCalculator user manual
site_url: https://seto77.github.io/PressureCalculator/
repo_url: https://github.com/seto77/PressureCalculator
repo_name: seto77/PressureCalculator
edit_uri: edit/master/docs/src/

docs_dir: src
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang:
        - en
        - ja
        - de
        - fr
        - es
        - pt
        - it
        - ru
        - zh
        - ko
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - abbr
  - pymdownx.snippets:
      base_path:
        - docs
        - .
      auto_append:
        - includes/abbreviations.md
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.mark

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - assets/javascripts/language_switch.js

extra:
  alternate:
    - name: English
      link: /PressureCalculator/
      lang: en
    - name: 日本語
      link: /PressureCalculator/ja/
      lang: ja
    - name: Deutsch
      link: /PressureCalculator/de/
      lang: de
    - name: Français
      link: /PressureCalculator/fr/
      lang: fr
    - name: Español
      link: /PressureCalculator/es/
      lang: es
    - name: Português
      link: /PressureCalculator/pt/
      lang: pt
    - name: Italiano
      link: /PressureCalculator/it/
      lang: it
    - name: Русский
      link: /PressureCalculator/ru/
      lang: ru
    - name: 简体中文
      link: /PressureCalculator/zh-Hans/
      lang: zh-Hans
    - name: 繁體中文
      link: /PressureCalculator/zh-Hant/
      lang: zh-Hant
    - name: 한국어
      link: /PressureCalculator/ko/
      lang: ko

