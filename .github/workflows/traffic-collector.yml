name: GitHub Traffic Collector

on:
  schedule:
    - cron: '37 16 * * *'  # 毎日 JST 1:37 (UTC 16:37)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # 261105Cl v4→v5 (node24 化。release.yml 等と揃える)
      - uses: actions/setup-python@v6 # 261105Cl v5→v6 (node24 化)
        with:
          python-version: '3.x'
      - name: Collect traffic data
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/github_traffic.py
      - name: Commit traffic.md if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${GITHUB_REPOSITORY#*/}/traffic.md"
          git diff --cached --quiet || git commit -m "chore: update traffic stats"
          git push
